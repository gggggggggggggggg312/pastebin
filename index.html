<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FGH LNGI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1>FGH LNGI</h1>

        <div class="stats">
            <div class="stat">
                <span>Points</span>
                <strong id="points">0</strong>
            </div>

            <div class="stat">
                <span>Click Power</span>
                <strong id="click_power">1</strong>
            </div>
        </div>

        <div id="number">f₀(10)</div>

        <div class="progress">
            <div id="progress_bar"></div>
        </div>

        <p id="progress_text">0%</p>

        <div class="next">
            Next: <span id="next">f₀²(10)</span>
        </div>

        <button id="advance">Advance</button>

        <section class="upgrades">
            <h2>Upgrades</h2>

            <div class="upgrade">
                <div>
                    <h3>Click Power</h3>
                    <p>Increase progress gained per click.</p>
                    <p>Level: <strong id="click_power_level">1</strong></p>
                    <p>Cost: <strong id="click_power_cost">10</strong> points</p>
                </div>

                <button id="buy_click_power">Upgrade</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
