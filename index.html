<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FGH LNGI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1>FGH LNGI</h1>

        <div id="number">f₀(10)</div>

        <div class="progress">
            <div id="progress_bar"></div>
        </div>

        <p id="progress_text">0%</p>

        <p>Next: <span id="next">f₀²(10)</span></p>

        <button id="advance">Advance</button>

        <section class="upgrades">
            <h2>Upgrades</h2>

            <div class="upgrade">
                <h3>Click Power</h3>
                <p>Power: <span id="click_power">1</span></p>
                <p>Cost: <span id="click_power_cost">10</span></p>
                <button id="buy_click_power">Upgrade</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
