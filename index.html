<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FGH LNGI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1>FGH LNGI</h1>

        <div id="number">f₀(10)</div>

        <div class="progress">
            <div id="progress_bar"></div>
        </div>

        <p id="progress_text">0%</p>

        <div class="next">
            Next: <span id="next">f₀²(10)</span>
        </div>

        <div class="stats">

            <div class="stat">
                <span class="stat-label">Points</span>
                <span id="points">0</span>
            </div>

        </div>

        <button id="advance">Advance</button>

        <section class="upgrades">

            <h2>Upgrades</h2>

            <div class="upgrade">

                <h3>Click Power</h3>

                <p>
                    Points per click:
                    <span id="click_power">1</span>
                </p>

                <p>
                    Progress per click:
                    <span id="click_progress">5</span>%
                </p>

                <p>
                    Cost:
                    <span id="click_power_cost">10</span>
                </p>

                <button id="buy_click_power">
                    Upgrade
                </button>

            </div>

            <div class="upgrade">

                <h3>Progress Power</h3>

                <p>
                    Progress multiplier:
                    <span id="progress_power">1</span>x
                </p>

                <p>
                    Cost:
                    <span id="progress_power_cost">25</span>
                </p>

                <button id="buy_progress_power">
                    Upgrade
                </button>

            </div>

            <div class="upgrade">

                <h3>Auto Advance</h3>

                <p>
                    Automatic advances:
                    <span id="auto_advance">0</span>/second
                </p>

                <p>
                    Cost:
                    <span id="auto_advance_cost">100</span>
                </p>

                <button id="buy_auto_advance">
                    Upgrade
                </button>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
